# Nginx vhost for the public demo at https://quizware.syss.hk
# The app also works behind a prefix (/quizware/) because every frontend URL is
# relative to the page; in that case move the proxy_pass locations under the
# prefix, e.g. location /quizware/ { proxy_pass http://127.0.0.1:4000/; }

limit_req_zone $binary_remote_addr zone=quizware_zone:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name quizware.syss.hk;

    # ACME challenge if you use certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quizware.syss.hk;

    # Managed by certbot or your own certs
    ssl_certificate     /etc/letsencrypt/live/quizware.syss.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizware.syss.hk/privkey.pem;

    # Socket.IO HTTP long-polling fallback (WebSockets go to Cloudflare first)
    client_max_body_size 256k;

    # Rate-limit room creation slightly on the public demo
    location = /api/session {
        limit_req zone=quizware_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/quizware_proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/quizware_proxy.inc;
    }
}
