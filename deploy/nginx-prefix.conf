# Optional: keep the old URL shape  https://syss.hk/quizware/  ->  container on :4000
# Use this instead of nginx-quizware.syss.hk.conf when the app must live under a path
# prefix on an existing site.
#
# The trailing slash on proxy_pass strips /quizware/, and every URL in the app is
# relative, so the same build works at "/" and at "/quizware/".

location /quizware/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /quizware {
    return 301 /quizware/;
}
